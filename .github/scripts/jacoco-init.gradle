gradle.allprojects { project ->
    project.plugins.withId('java') {
        if (!project.plugins.hasPlugin('jacoco')) {
            project.apply plugin: 'jacoco'
        }

    
        project.plugins.withId('jacoco') {
            project.tasks.withType(Test).configureEach { testTask ->
                testTask.finalizedBy project.tasks.withType(JacocoReport)
            }

            project.tasks.withType(JacocoReport).configureEach {
                reports {
                    xml.required = true
                    html.required = false
                }
            }
        }
    }
}
