name: Student Coverage

run-name: coverage-${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Coverage run UUID (from coverage_runs table)'
        required: true
      repo_url:
        description: 'Student GitHub repository URL'
        required: true
      branch:
        description: 'Branch to clone (optional, defaults to repo default branch)'
        required: false
        default: ''
      lab_number:
        description: 'Lab number'
        required: true
      java_version:
        description: 'Java version (17, 21, 24)'
        required: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout our repo to get the helper scripts
      - name: Checkout analyzer repo
        uses: actions/checkout@v4
        with:
          path: analyzer

      - name: Clone student repository
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            git clone --depth=1 --branch "${{ inputs.branch }}" "${{ inputs.repo_url }}" student-repo
          else
            git clone --depth=1 "${{ inputs.repo_url }}" student-repo
          fi
      

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('student-repo/**/*.gradle*', 'student-repo/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('student-repo/**/pom.xml') }}
          restore-keys: maven-

      
      - name: Run tests with coverage
        continue-on-error: true
        env:
          JACOCO_INIT_SCRIPT: ${{ github.workspace }}/analyzer/.github/scripts/jacoco-init.gradle
          GRADLE_OPTS: "-Xmx512m -Dorg.gradle.daemon=false"
        run: |
          cd student-repo
          bash ${{ github.workspace }}/analyzer/.github/scripts/run-coverage.sh

      - name: Parse coverage reports and build artifact JSON
        run: |
          python3 ${{ github.workspace }}/analyzer/.github/scripts/parse_coverage.py \
            --project-dir ${{ github.workspace }}/student-repo \
            --output ${{ github.workspace }}/coverage-result.json

      
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.run_id }}
          path: coverage-result.json
          retention-days: 7
